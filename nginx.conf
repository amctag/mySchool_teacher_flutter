server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain
               text/css
               text/javascript
               application/javascript
               application/json
               application/xml
               image/svg+xml;

    # FCM service worker must be a real JS file at the site root (not SPA HTML).
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /firebase-config.js {
        add_header Cache-Control "no-cache" always;
        default_type application/javascript;
        try_files $uri =404;
    }

    # App icons never change between releases -> cache them for a week.
    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /favicon.png {
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Flutter engine and app bundle (main.dart.js, flutter.js, canvaskit).
    # "no-cache" = reuse only after a 304 revalidation, so the next deployment
    # is picked up on the very next page load instead of serving a stale app.
    location ~* \.(?:js|mjs|css|wasm|map)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # App assets (images, fonts, AssetManifest, version.json): always
    # revalidated as well; a stale manifest would break a fresh release.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Flutter SPA routing. Every unknown path (/, /login, /dashboard, deep
    # links) falls back to index.html so direct URLs and browser refreshes
    # work in production.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
